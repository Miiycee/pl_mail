                step4: '注册后，将“应用程序（客户端）ID”复制到左侧字段。'
                step5: '在“证书和密码”中创建新的客户端密码，并立即复制其“值”而不是 ID；该值只显示一次。'
                step6: '在“API 权限”中添加以下 Microsoft Graph 委托权限：Mail.ReadWrite、Mail.Send、MailboxSettings.ReadWrite、Calendars.ReadWrite、User.Read 和 offline_access。缺少 MailboxSettings.ReadWrite 或 Calendars.ReadWrite 时仍可登录，但不会有邮件分类或日历；新增权限也不会自动更新已经签发的令牌。'
